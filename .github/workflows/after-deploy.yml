# Снимает продакшен после выкатки и готовит список правок для макета.
#
# Почему не «всё в один шаг»: сверка с Figma требует запущенного десктопного
# приложения (на плане Professional переменные читаются только плагином), а это
# невозможно в CI. Поэтому здесь делается всё, что машина может сделать сама —
# слепок прода, разбор коммитов по вкладкам, issue со списком, — а сверка с
# макетом и запись страницы правок остаются локальным шагом.

name: after-deploy

on:
  # Раз в сутки, 22:00 UTC = 01:00 по Киеву. Ночью потому, что слепок держит
  # единственное ядро сервера 5-7 минут, и днём сайты отвечали бы медленнее.
  # Окно выбрано между суточными задачами: бэкапы идут с 03:00 UTC, снимок
  # контента сети — в 04:17.
  #
  # Раньше здесь стоял repository_dispatch и слепок снимался после каждой
  # выкатки: 109 прогонов за август, ~760 минут. Теперь ~30 прогонов, и все
  # на своём раннере, то есть бесплатно.
  schedule:
    - cron: '0 22 * * *'
  # Ручной запуск — чтобы можно было прогнать в любой момент.
  workflow_dispatch:
    inputs:
      since:
        description: 'С какого коммита разбирать историю (например HEAD~10)'
        required: false
        default: 'HEAD~20'

concurrency:
  group: after-deploy
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: [self-hosted, linux, figma-sync]
    timeout-minutes: 30
    steps:
      - name: Забрать агента
        uses: actions/checkout@v4
        with:
          # Вся история: в конце прогон сводит своё состояние с уехавшей веткой
          # через rebase, а на срезанном клоне ему не от чего оттолкнуться.
          # Репозиторий меньше мегабайта, полная выборка ничего не стоит.
          fetch-depth: 0

      - name: Забрать продакшен
        uses: actions/checkout@v4
        with:
          repository: Kostia8262/my_computer_new
          token: ${{ secrets.PROD_REPO_TOKEN }}
          path: prod
          fetch-depth: 100

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      # Системные библиотеки Chromium установлены на сервере один раз, вручную:
      # --with-deps полез бы в apt под root, а у этого раннера нет sudo и не
      # должно быть. Сами браузеры лежат в кеше пользователя и переживают прогон.
      - run: npx playwright install chromium

      - name: Токены и разбор истории по вкладкам
        env:
          MC_REPO_PATH: ${{ github.workspace }}/prod
        run: |
          node src/cli.js snapshot
          node tools/tab-changes.mjs "${{ github.event.inputs.since || '2026-08-01' }}"

      - name: Слепок продакшена
        env:
          MC_ADMIN_TOKEN: ${{ secrets.MC_ADMIN_TOKEN }}
          MC_REPO_PATH: ${{ github.workspace }}/prod
        run: node src/cli.js tabs --target dashboard

      # Состояние живёт в репозитории агента: так обе машины видят одну картину
      # и любая может догнать пропущенные выкатки.
      - name: Сохранить состояние
        run: |
          git config user.name  "figma-sync bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "Состояние не изменилось — отправлять нечего"
            exit 0
          fi
          git commit -m "chore(state): снимок прода после выкатки"

          # Между забором репозитория и этой строкой проходят минуты слепка, и
          # за это время ветка почти наверняка уезжает: её двигают и локальный
          # daily-sync, и соседний прогон здесь. Голый push тогда падает с
          # «! [rejected] main -> main (fetch first)» — так и случилось на
          # первом же боевом прогоне 2026-08-17, и весь получасовой слепок
          # пропал зря.
          #
          # -X theirs: при rebase «theirs» — это наши коммиты, HEAD в этот
          # момент чужой. Состояние — снимок, а не история правок, поэтому при
          # расхождении верен самый свежий, то есть наш; чужие файлы, которых
          # мы не трогали, при этом остаются на месте.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Ветка ушла вперёд, свожу и повторяю (попытка $attempt)"
            git fetch origin "$GITHUB_REF_NAME" || exit 1
            git rebase -X theirs FETCH_HEAD || { git rebase --abort || true; exit 1; }
          done
          echo "::error title=Состояние не сохранено::Три попытки отправить снимок закончились отказом — ветка уезжает быстрее, чем прогон успевает свестись."
          exit 1

      - name: Issue со списком затронутых вкладок
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node src/cli.js issue --target dashboard > "$RUNNER_TEMP/issue.md" || echo "нечего сообщать" > "$RUNNER_TEMP/issue.md"

          # На машинах GitHub здесь работал gh CLI. На своём раннере его нет, и
          # ставить его на боевой сервер ради одного вызова незачем — тот же
          # результат даёт обычный запрос к API. Тело собирается через node, а
          # не склейкой строк: в отчёте бывают и кавычки, и переводы строк.
          #
          # $RUNNER_TEMP вместо /tmp: сервер общий, в /tmp пишут и другие.
          node -e '
            const fs = require("fs");
            const tmp = process.env.RUNNER_TEMP;
            const body = fs.readFileSync(tmp + "/issue.md", "utf8");
            const title = "Правки макета после выкатки " + new Date().toISOString().slice(0, 10);
            fs.writeFileSync(tmp + "/issue.json", JSON.stringify({ title, body, labels: ["figma-sync"] }));
          '

          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-binary @"$RUNNER_TEMP/issue.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" > /dev/null || true
